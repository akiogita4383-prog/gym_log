<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E1116">
<title>REPS — トレーニング記録</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REPS">
<meta name="application-name" content="REPS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root{
    --bg:#0E1116; --surface:#161B23; --surface2:#1F2632; --line:#2A323E;
    --text:#EAEEF4; --muted:#8B95A7; --faint:#5B6577;
    --accent:#5B9CFF; --accent-dim:#2C4A7A; --pr:#FFBC5C; --danger:#FF6B6B; --ok:#46D6A6;
    --r:14px; --r-sm:10px;
    --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
  body{font-size:15px;line-height:1.45;padding-bottom:calc(76px + var(--safe-b));max-width:560px;margin:0 auto;min-height:100vh}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit;color:var(--text)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{display:none}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:14px 16px 8px}
  .wordmark{display:flex;align-items:baseline;gap:8px}
  .wordmark b{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.16em}
  .wordmark span{color:var(--muted);font-size:11px;letter-spacing:.04em}
  .datebar{display:flex;align-items:center;gap:8px;margin-top:12px}
  .datebar .nav{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface);display:grid;place-items:center;font-size:18px;color:var(--muted)}
  .datebar .nav:active{background:var(--surface2)}
  .datepill{flex:1;text-align:center;background:var(--surface);border-radius:var(--r-sm);padding:8px 0}
  .datepill .d{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.02em}
  .datepill .w{font-size:11px;color:var(--muted);margin-top:1px}
  .datepill.today .w{color:var(--accent)}

  main{padding:4px 16px 28px}
  .tab-view{display:none}.tab-view.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Section */
  .section{margin-top:18px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}
  .sec-head h2{font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--muted);margin:0;text-transform:uppercase}
  .sec-head .val{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .card{background:var(--surface);border-radius:var(--r);padding:14px}
  .card + .card{margin-top:10px}

  /* Chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 13px;border-radius:999px;background:var(--surface2);font-size:13.5px;color:var(--text);border:1px solid transparent;white-space:nowrap}
  .chip:active{background:var(--accent-dim)}
  .chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
  .chip .g{color:var(--faint);font-size:11px;margin-right:5px}

  /* Exercise card */
  .ex{background:var(--surface);border-radius:var(--r);padding:13px 13px 11px;border:1px solid var(--line)}
  .ex + .ex{margin-top:10px}
  .ex.pr{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr) inset,0 6px 24px -12px var(--pr)}
  .ex-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ex-name{font-weight:600;font-size:15.5px}
  .ex-name .grp{color:var(--faint);font-size:11px;font-weight:500;margin-left:6px}
  .ex-vol{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .x{color:var(--faint);font-size:15px;padding:2px 4px}

  .setlist{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
  .setrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;background:var(--surface2);border-radius:var(--r-sm);padding:7px 10px}
  .setrow .n{color:var(--faint);font-size:11px;width:20px}
  .setrow .v{flex:1}
  .setrow .v b{font-weight:600}
  .setrow .v .mult{color:var(--faint);margin:0 5px}
  .setrow .badge{color:var(--pr);font-size:11px;font-weight:600;letter-spacing:.04em}
  .setrow .del{color:var(--faint);font-size:13px;padding:0 2px}

  .stepper-wrap{display:flex;gap:8px;margin-top:11px}
  .stepper{flex:1;background:var(--surface2);border-radius:var(--r-sm);padding:7px 8px;text-align:center}
  .stepper .lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .stepper .ctrl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:3px}
  .stepper .pm{width:30px;height:30px;border-radius:8px;background:var(--surface);font-size:19px;color:var(--accent);display:grid;place-items:center;line-height:1}
  .stepper .pm:active{background:var(--accent-dim)}
  .stepper input{width:62px;background:transparent;border:none;text-align:center;font-family:var(--mono);font-size:20px;font-weight:600;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
  .stepper .unit{font-size:11px;color:var(--faint);margin-left:1px}

  .btn{width:100%;padding:13px;border-radius:var(--r-sm);font-size:15px;font-weight:600;text-align:center}
  .btn-accent{background:var(--accent);color:#08111F;margin-top:10px}
  .btn-accent:active{filter:brightness(.92)}
  .btn-ghost{background:var(--surface2);color:var(--text)}
  .hint{margin-top:9px;font-size:12px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;gap:7px}
  .hint button{color:var(--accent);font-size:12px;font-weight:600}

  /* Cardio / body inputs */
  .field-row{display:flex;gap:10px;margin-top:10px}
  .field{flex:1;background:var(--surface2);border-radius:var(--r-sm);padding:9px 11px}
  .field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
  .field .inrow{display:flex;align-items:baseline;gap:4px;margin-top:2px}
  .field input{width:100%;background:transparent;border:none;font-family:var(--mono);font-size:19px;font-weight:600;-moz-appearance:textfield}
  .field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none}
  .field .unit{font-size:11px;color:var(--faint)}
  .field.txt input{font-family:var(--sans);font-size:15px;font-weight:500}
  .field .inrow input.t{width:2.6em}

  .cardio-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;background:var(--surface2);border-radius:var(--r-sm);padding:9px 11px;margin-top:8px}
  .cardio-row .ico{font-size:15px}
  .cardio-row .t{flex:1}
  .cardio-row .meta{color:var(--muted);font-size:12.5px}

  /* Mood */
  .moods{display:flex;gap:8px;justify-content:space-between}
  .mood{flex:1;aspect-ratio:1;max-width:56px;border-radius:var(--r-sm);background:var(--surface2);display:grid;place-items:center;font-size:24px;filter:grayscale(.6) opacity(.6)}
  .mood.on{background:var(--accent-dim);filter:none;outline:1px solid var(--accent)}
  textarea.memo{width:100%;margin-top:10px;background:var(--surface2);border:none;border-radius:var(--r-sm);padding:11px;font-size:14px;line-height:1.5;resize:none;min-height:64px}

  .empty{color:var(--faint);font-size:13px;text-align:center;padding:14px 0}
  .warn{margin:10px 16px 0;background:#2E1E12;border:1px solid #8A5423;color:#FFD9AD;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.55}
  .warn b{color:#FFB55C}
  .data-row{display:flex;gap:10px}
  .data-row .btn{flex:1;margin-top:0}
  .data-status{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
  .data-status b{color:var(--pr)}

  /* History */
  .hday{background:var(--surface);border-radius:var(--r);padding:13px 14px;margin-top:10px}
  .hday .top{display:flex;align-items:center;justify-content:space-between}
  .hday .top .dt{font-family:var(--mono);font-weight:600}
  .hday .top .dt small{color:var(--faint);font-weight:400;margin-left:6px;font-size:11px}
  .hday .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);font-family:var(--mono)}
  .tag.s{color:var(--accent)}.tag.c{color:var(--ok)}.tag.b{color:var(--text)}
  .hday .detail{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .hday.open .detail{display:block}
  .hday .detail .line{padding:2px 0}
  .hday .detail .line b{color:var(--text);font-weight:600}

  /* Analysis */
  .seg{display:flex;gap:6px;background:var(--surface);border-radius:var(--r-sm);padding:4px;margin-bottom:12px}
  .seg button{flex:1;padding:8px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:600}
  .seg button.on{background:var(--surface2);color:var(--text)}
  .chartcard{background:var(--surface);border-radius:var(--r);padding:14px}
  .chartcard h3{margin:0 0 2px;font-size:14px}
  .chartcard .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
  svg.chart{width:100%;display:block;overflow:visible}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{background:var(--surface);border-radius:var(--r);padding:13px}
  .stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .stat .v{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:3px}
  .stat .v small{font-size:12px;color:var(--faint);font-weight:500}
  select.exsel{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;font-size:14px;margin-bottom:12px;-webkit-appearance:none;appearance:none}

  /* Bottom nav */
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:rgba(14,17,22,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + var(--safe-b));z-index:30}
  nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.04em}
  nav.tabbar button .ic{font-size:20px;line-height:1}
  nav.tabbar button.on{color:var(--accent)}

  /* Sheet (picker) */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:84vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
  .sheet.on{transform:none}
  .sheet .grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px}
  .sheet .sh-head{padding:6px 16px 10px;display:flex;align-items:center;justify-content:space-between}
  .sheet .sh-head h3{margin:0;font-size:16px}
  .sheet .sh-head button{color:var(--accent);font-size:14px;font-weight:600}
  .search{margin:0 16px 8px;background:var(--surface2);border:none;border-radius:var(--r-sm);padding:11px 13px;font-size:15px}
  .sh-body{overflow-y:auto;padding:4px 16px 18px}
  .grouplbl{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin:14px 2px 7px;font-weight:700}
  .pick{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;background:var(--surface2);border-radius:var(--r-sm);margin-bottom:6px;font-size:15px}
  .pick:active{background:var(--accent-dim)}
  .pick .last{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pick.new{color:var(--accent);font-weight:600}
  .cardio-pick{display:flex;flex-wrap:wrap;gap:8px}

  .toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.pr{border-color:var(--pr);color:var(--pr)}
</style>
</head>
<body>
<header>
  <div class="wordmark"><b>REPS</b><span>トレーニングの記録</span></div>
  <div class="datebar">
    <button class="nav" id="prevDay">‹</button>
    <button class="datepill" id="datePill"><div class="d" id="dpDate">—</div><div class="w" id="dpWeek">—</div></button>
    <button class="nav" id="nextDay">›</button>
  </div>
</header>

<div class="warn" id="warn" style="display:none">
  <b>⚠ このままだと記録が保存されません。</b><br>
  自動保存するには、REPSを<b>httpsのURLで開き、ホーム画面に追加</b>して、そのアイコンから起動してください（下のREADME/手順を参照）。ローカルファイルを直接開いた状態では保存できません。当面は下の「バックアップ書き出し」で控えを取れます。
</div>

<main>
  <!-- 記録 -->
  <section class="tab-view active" id="tab-log">
    <div class="section">
      <div class="sec-head"><h2>筋トレ</h2><span class="val" id="strVol">0 kg·vol</span></div>
      <div id="strList"></div>
      <div class="chips" id="freqChips" style="margin-top:10px"></div>
    </div>

    <div class="section">
      <div class="sec-head"><h2>有酸素</h2></div>
      <div id="cardioList"></div>
      <div class="chips" id="cardioChips" style="margin-top:10px"></div>
    </div>

    <div class="section">
      <div class="sec-head"><h2>体重・体組成</h2></div>
      <div class="card">
        <div class="field-row">
          <div class="field"><label>体重</label><div class="inrow"><input id="bw" type="number" inputmode="decimal" placeholder="—"><span class="unit">kg</span></div></div>
          <div class="field"><label>体脂肪率</label><div class="inrow"><input id="bf" type="number" inputmode="decimal" placeholder="—"><span class="unit">%</span></div></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><h2>メモ・気分</h2></div>
      <div class="card">
        <div class="moods" id="moods"></div>
        <textarea class="memo" id="memo" placeholder="今日のコンディション、気づいたことなど…"></textarea>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><h2>データ</h2><span class="val" id="saveStatus">—</span></div>
      <div class="card">
        <div class="data-row">
          <button class="btn btn-ghost" id="btnExport">バックアップ書き出し</button>
          <button class="btn btn-ghost" id="btnImport">読み込み</button>
        </div>
        <div class="data-status" id="dataNote"></div>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </section>
  <section class="tab-view" id="tab-history">
    <div id="historyList"></div>
  </section>

  <!-- 分析 -->
  <section class="tab-view" id="tab-stats">
    <div class="seg" id="statSeg">
      <button class="on" data-s="overview">概要</button>
      <button data-s="body">体重</button>
      <button data-s="exercise">種目別</button>
      <button data-s="cardio">有酸素</button>
    </div>
    <div id="statBody"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="on" data-tab="log"><span class="ic">✎</span>記録</button>
  <button data-tab="history"><span class="ic">▤</span>履歴</button>
  <button data-tab="stats"><span class="ic">◔</span>分析</button>
</nav>

<!-- Exercise picker sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="exSheet">
  <div class="grip"></div>
  <div class="sh-head"><h3>種目を選ぶ</h3><button id="exClose">閉じる</button></div>
  <input class="search" id="exSearch" placeholder="検索 / 新しい種目名を入力">
  <div class="sh-body" id="exPickBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY="reps_db_v1";

/* ---------- default library ---------- */
const DEFAULT_EX=[
  ["胸",["チェストプレス","ペクトラル・フライ"]],
  ["背中",["ロー","プルダウン"]],
  ["肩",["ショルダープレス","リア・デルトイド"]],
  ["脚",["シーテッド・レッグ・プレス","レッグエクステンション","レッグカール","ヒップアブダクター","ヒップアダクター"]],
  ["体幹",["アブドミナル","トーソ・ローテーション"]],
];
const CARDIO_TYPES=[["🏃","トレッドミル"],["🚴","バイク"],["🌀","エリプティカル"]];
const MOODS=["😣","😐","🙂","💪","🔥"];

/* ---------- state ---------- */
let DB;
let curDate=new Date();
let curTab="log";
let stepW=2.5, stepR=1;

/* ---------- storage (robust for local files) ---------- */
let storageOK=(function(){try{localStorage.setItem("__reps_probe","1");localStorage.removeItem("__reps_probe");return true;}catch(e){return false;}})();
function load(){
  if(!storageOK)return freshDB();
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.logs&&d.exercises)return d;}catch(e){}
  return freshDB();
}
function freshDB(){const ex=[];DEFAULT_EX.forEach(([g,arr])=>arr.forEach(n=>ex.push({id:uid(),name:n,grp:g})));return {exercises:ex,logs:{},customCardio:[]};}
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){storageOK=false;onStorageLost();}}
function onStorageLost(){const w=$("#warn");if(w)w.style.display="block";updateSaveStatus();}
function uid(){return Math.random().toString(36).slice(2,9)}
function migrate(){
  const flat=[];DEFAULT_EX.forEach(([g,arr])=>arr.forEach(n=>flat.push([g,n])));
  const machineNames=new Set(flat.map(x=>x[1]));
  const used=new Set();for(const k in DB.logs)(DB.logs[k].strength||[]).forEach(e=>used.add(e.exId));
  // keep the new machines, anything the user actually logged, and custom-added exercises
  DB.exercises=DB.exercises.filter(e=>machineNames.has(e.name)||used.has(e.id)||e.grp==="その他");
  const have=new Set(DB.exercises.map(e=>e.name));
  flat.forEach(([g,n])=>{if(!have.has(n)){DB.exercises.push({id:uid(),name:n,grp:g});have.add(n);}});
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="reps-backup-"+key(new Date())+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("バックアップを書き出しました");
  }catch(e){toast("書き出しに失敗しました");}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(d&&d.logs&&d.exercises){DB=d;migrate();save();renderLog();switchTab("log");toast("バックアップを読み込みました");}
    else toast("ファイル形式が正しくありません");
  }catch(e){toast("読み込みに失敗しました");}};
  r.readAsText(file);
}
function updateSaveStatus(){
  const s=$("#saveStatus"),n=$("#dataNote");if(!s||!n)return;
  if(storageOK){s.textContent="自動保存 ✓";s.style.color="var(--ok)";
    n.innerHTML="この端末に自動で保存されています。機種変更や共有の前には「バックアップ書き出し」で控えを取ってください。";}
  else{s.textContent="自動保存 オフ";s.style.color="var(--pr)";

}

/* ---------- date helpers ---------- */
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function isToday(d){return key(d)===key(new Date())}
const WD=["日","月","火","水","木","金","土"];
function day(){const k=key(curDate);if(!DB.logs[k])DB.logs[k]={strength:[],cardio:[],body:{},memo:{}};return DB.logs[k]}

/* ---------- prefill / PR ---------- */
function e1rm(w,r){return w*(1+r/30)}
function lastFor(exId){
  const keys=Object.keys(DB.logs).filter(k=>k<key(curDate)||(k===key(curDate))).sort().reverse();
  for(const k of keys){
    if(k===key(curDate))continue;
    const s=DB.logs[k].strength.find(e=>e.exId===exId&&e.sets.length);
    if(s){const last=s.sets[s.sets.length-1];return {w:last.w,r:last.r,sets:s.sets};}
  }
  return null;
}
function bestBefore(exId,excludeDateKey){
  let best=0;
  for(const k in DB.logs){
    DB.logs[k].strength.forEach(e=>{if(e.exId===exId)e.sets.forEach((st,i)=>{
      if(k===excludeDateKey)return; // exclude entire current-day adds handled by caller
      best=Math.max(best,e1rm(st.w,st.r));
    });});
  }
  return best;
}

function toast(msg,pr){const t=$("#toast");t.textContent=msg;t.className="toast on"+(pr?" pr":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",1600);}

function renderOverview(b){

  </div>
  <div class="chartcard"><h3>週別ボリューム</h3><div class="sub">直近8週間 / kg·vol</div>${barChart(wv,["7週前","","","","","","先週","今週"])}</div>`;

function renderBodyChart(b){
  const pts=[];for(const k in DB.logs){const w=DB.logs[k].body.weight;if(w!=null){const[y,m,d]=k.split("-");pts.push({t:new Date(+y,+m-1,+d).getTime(),y:w,lbl:+m+"/"+(+d)});}}
  pts.sort((a,x)=>a.t-x.t);
  if(pts.length<1){b.innerHTML='<div class="empty" style="padding:40px 0">体重の記録がありません</div>';return;}
  const fat=[];for(const k in DB.logs){const f=DB.logs[k].body.fat;if(f!=null){const[y,m,d]=k.split("-");fat.push({t:new Date(+y,+m-1,+d).getTime(),y:f,lbl:+m+"/"+(+d)});}}
  fat.sort((a,x)=>a.t-x.t);
  const latest=pts[pts.length-1].y, first=pts[0].y, diff=+(latest-first).toFixed(1);
  b.innerHTML=`<div class="stat-grid">
    <div class="stat"><div class="k">現在</div><div class="v">${latest}<small> kg</small></div></div>
    <div class="stat"><div class="k">最初から</div><div class="v" style="color:${diff<0?'var(--ok)':diff>0?'var(--pr)':'var(--text)'}">${diff>0?"+":""}${diff}<small> kg</small></div></div>
  </div>
  <div class="chartcard"><h3>体重の推移</h3><div class="sub">kg</div>${lineChart(pts,"var(--accent)")}</div>
  ${fat.length?`<div class="chartcard" style="margin-top:12px"><h3>体脂肪率</h3><div class="sub">%</div>${lineChart(fat,"var(--pr)")}</div>`:""}`;
}
function renderExerciseChart(b){
  const used=new Set();for(const k in DB.logs)DB.logs[k].strength.forEach(e=>used.add(e.exId));
  const opts=DB.exercises.filter(e=>used.has(e.id));
  if(!opts.length){b.innerHTML='<div class="empty" style="padding:40px 0">筋トレの記録がありません</div>';return;}
  const sel=`<select class="exsel" id="exStatSel">${opts.map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select>`;
  const exId=window._statEx&&opts.find(e=>e.id===window._statEx)?window._statEx:opts[0].id;
  window._statEx=exId;
  const pts=[],volpts=[];
  Object.keys(DB.logs).sort().forEach(k=>{
    const e=DB.logs[k].strength.find(x=>x.exId===exId);if(!e||!e.sets.length)return;
    const[y,m,d]=k.split("-");const t=new Date(+y,+m-1,+d).getTime();const lbl=+m+"/"+(+d);
    const maxE=Math.max(...e.sets.map(s=>e1rm(s.w,s.r)));
    pts.push({t,y:Math.round(maxE*10)/10,lbl});
    volpts.push({t,y:e.sets.reduce((a,s)=>a+s.w*s.r,0),lbl});
  });
  const best=pts.length?Math.max(...pts.map(p=>p.y)):0;
  b.innerHTML=sel+`<div class="stat-grid">
    <div class="stat"><div class="k">推定1RM 最高</div><div class="v">${fmt(best)}<small> kg</small></div></div>
    <div class="stat"><div class="k">記録回数</div><div class="v">${pts.length}</div></div>
  </div>
  ${pts.length?`<div class="chartcard"><h3>推定1RMの推移</h3><div class="sub">Epley式 / kg</div>${lineChart(pts,"var(--accent)")}</div>
  <div class="chartcard" style="margin-top:12px"><h3>ボリュームの推移</h3><div class="sub">kg·vol</div>${barChart(volpts.map(p=>p.y),volpts.map(p=>p.lbl))}</div>`:'<div class="empty">データ不足</div>'}`;
  $("#exStatSel").value=exId;
  $("#exStatSel").onchange=e=>{window._statEx=e.target.value;renderExerciseChart(b);};
}

/* ---------- 分析: 有酸素 ---------- */
function num(v){return (v===""||v==null||isNaN(+v))?null:+v;}
function fmtDur(mins){mins=Math.round(mins);const h=Math.floor(mins/60),m=mins%60;return h?h+"時間"+m+"分":m+"分";}
function renderCardioStats(b){
  const usedTypes=CARDIO_TYPES.filter(([ico,name])=>Object.keys(DB.logs).some(k=>(DB.logs[k].cardio||[]).some(c=>c.type===name)));
  if(!usedTypes.length){b.innerHTML='<div class="empty" style="padding:40px 0">有酸素の記録がありません</div>';return;}
  const type=(window._statCardio&&usedTypes.some(t=>t[1]===window._statCardio))?window._statCardio:usedTypes[0][1];
  window._statCardio=type;
  const sel=`<select class="exsel" id="cardioStatSel">${usedTypes.map(([ico,name])=>`<option value="${name}"${name===type?" selected":""}>${ico} ${name}</option>`).join("")}</select>`;
  const rows=[];
  Object.keys(DB.logs).sort().forEach(k=>{(DB.logs[k].cardio||[]).forEach(c=>{if(c.type!==type)return;const[y,mo,da]=k.split("-");rows.push({t:new Date(+y,+mo-1,+da).getTime(),lbl:(+mo)+"/"+(+da),dist:num(c.dist),kcal:num(c.kcal),minutes:(num(c.min)||0)+(num(c.sec)||0)/60,spdMax:num(c.spdMax),spdMin:num(c.spdMin)});});});
  const sessions=rows.length;
  const totDist=rows.reduce((a,r)=>a+(r.dist||0),0);
  const totKcal=rows.reduce((a,r)=>a+(r.kcal||0),0);
  const totMin=rows.reduce((a,r)=>a+(r.minutes||0),0);
  const maxSpd=Math.max(0,...rows.map(r=>r.spdMax||0));
  const distPts=rows.filter(r=>r.dist!=null).map(r=>({t:r.t,y:r.dist,lbl:r.lbl}));
  const hasKcal=rows.some(r=>r.kcal!=null);
  const hasSpd=rows.some(r=>r.spdMax!=null||r.spdMin!=null);
  b.innerHTML=sel+`<div class="stat-grid">
    <div class="stat"><div class="k">記録回数</div><div class="v">${sessions}</div></div>
    <div class="stat"><div class="k">合計距離</div><div class="v">${fmt(Math.round(totDist*10)/10)}<small> km</small></div></div>
    <div class="stat"><div class="k">合計時間</div><div class="v" style="font-size:20px">${fmtDur(totMin)}</div></div>
    <div class="stat"><div class="k">合計カロリー</div><div class="v">${fmt(Math.round(totKcal))}<small> kcal</small></div></div>
  </div>
  ${distPts.length?`<div class="chartcard"><h3>距離の推移</h3><div class="sub">km</div>${lineChart(distPts,"var(--accent)")}</div>`:""}
  ${hasKcal?`<div class="chartcard" style="margin-top:12px"><h3>消費カロリーの推移</h3><div class="sub">kcal / 回</div>${barChart(rows.map(r=>r.kcal||0),rows.map(r=>r.lbl))}</div>`:""}
  ${hasSpd?`<div class="chartcard" style="margin-top:12px"><h3>時速の推移</h3><div class="sub">km/h ・ 最高 ${maxSpd?fmt(maxSpd):"—"}</div>${speedChart(rows)}</div>`:""}`;
  const s=$("#cardioStatSel");if(s)s.onchange=e=>{window._statCardio=e.target.value;renderCardioStats(b);};
}
function speedChart(rows){
  const W=480,H=170,pad=26,n=rows.length;
  const maxPts=rows.map((r,i)=>r.spdMax!=null?{i,y:r.spdMax}:null).filter(Boolean);
  const minPts=rows.map((r,i)=>r.spdMin!=null?{i,y:r.spdMin}:null).filter(Boolean);
  const all=[...maxPts,...minPts].map(p=>p.y);
  if(!all.length)return '<div class="empty">時速データなし</div>';
  const lo=Math.min(...all),hi=Math.max(...all),span=(hi-lo)||1;
  const x=i=>pad+(W-pad*2)*(n<2?0.5:i/(n-1));
  const y=v=>H-pad-(H-pad*2)*((v-lo)/span);
  const draw=(pts,color)=>pts.length?`<path d="${pts.map((p,j)=>(j?"L":"M")+x(p.i).toFixed(1)+" "+y(p.y).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="2.4" fill="${color}"/>`).join(""):"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    ${draw(maxPts,"var(--accent)")}${draw(minPts,"var(--pr)")}
    <text x="${pad}" y="14" fill="var(--faint)" font-size="11" font-family="monospace">${fmt(hi)}</text>
    <text x="${pad}" y="${H-pad+16}" fill="var(--faint)" font-size="10" font-family="monospace">${rows[0]?rows[0].lbl:""}</text>
    <text x="${W-pad}" y="${H-pad+16}" fill="var(--faint)" font-size="10" font-family="monospace" text-anchor="end">${rows[n-1]?rows[n-1].lbl:""}</text>
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;font-family:var(--mono)"><span style="color:var(--accent)">● 最高時速</span><span style="color:var(--pr)">● 最低時速</span></div>`;
}

/* ---------- SVG charts ---------- */
function lineChart(pts,color){
  const W=480,H=160,pad=26;
  if(pts.length===1)pts=[{...pts[0],t:pts[0].t-864e5},pts[0]];
  const ys=pts.map(p=>p.y),minY=Math.min(...ys),maxY=Math.max(...ys),span=(maxY-minY)||1;
  const x=i=>pad+(W-pad*2)*(pts.length<2?.5:i/(pts.length-1));
  const y=v=>H-pad-(H-pad*2)*((v-minY)/span);
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.y).toFixed(1)).join(" ");
  const area=`M${x(0)} ${H-pad} `+pts.map((p,i)=>"L"+x(i).toFixed(1)+" "+y(p.y).toFixed(1)).join(" ")+` L${x(pts.length-1)} ${H-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="2.5" fill="${color}"/>`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    <path d="${area}" fill="${color}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad}" y="14" fill="var(--faint)" font-size="11" font-family="monospace">${fmt(maxY)}</text>
    <text x="${pad}" y="${H-pad+16}" fill="var(--faint)" font-size="10" font-family="monospace">${pts[0].lbl||""}</text>
    <text x="${W-pad}" y="${H-pad+16}" fill="var(--faint)" font-size="10" font-family="monospace" text-anchor="end">${last.lbl||""}</text>
  </svg>`;
}
function barChart(vals,labels){
  const W=480,H=160,pad=26,n=vals.length;
  const maxV=Math.max(...vals,1);
  const bw=(W-pad*2)/n*0.62, gap=(W-pad*2)/n;
  const bars=vals.map((v,i)=>{
    const h=(H-pad*2)*(v/maxV);const xx=pad+gap*i+(gap-bw)/2;const yy=H-pad-h;
    const isLast=i===n-1;
    return `<rect x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="${isLast?'var(--accent)':'var(--accent-dim)'}"/>
    ${(labels[i])?`<text x="${(xx+bw/2).toFixed(1)}" y="${H-pad+15}" fill="var(--faint)" font-size="9.5" font-family="monospace" text-anchor="middle">${labels[i]}</text>`:""}`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    <text x="${pad}" y="14" fill="var(--faint)" font-size="11" font-family="monospace">${fmt(maxV)}</text>${bars}</svg>`;
}

/* ---------- picker sheet ---------- */
function openSheet(){$("#scrim").classList.add("on");$("#exSheet").classList.add("on");$("#exSearch").value="";renderPick("");setTimeout(()=>$("#exSearch").focus(),250);}
function closeSheet(){$("#scrim").classList.remove("on");$("#exSheet").classList.remove("on");$("#exSearch").blur();}
function renderPick(q){
  const body=$("#exPickBody");body.innerHTML="";q=q.trim();
  const open=new Set(day().strength.map(e=>e.exId));
  const groups={};
  DB.exercises.forEach(e=>{if(q&&!e.name.includes(q))return;(groups[e.grp]=groups[e.grp]||[]).push(e);});
  const order=["胸","背中","肩","脚","体幹","腕","その他"];
  const keys=[...new Set([...order,...Object.keys(groups)])].filter(g=>groups[g]);
  keys.forEach(g=>{
    const lbl=document.createElement("div");lbl.className="grouplbl";lbl.textContent=g;body.appendChild(lbl);
    groups[g].forEach(e=>{
      const last=lastFor(e.id);
      const row=document.createElement("button");row.className="pick";
      row.innerHTML=`<span>${e.name}${open.has(e.id)?' <span style="color:var(--ok);font-size:12px">✓</span>':""}</span>${last?`<span class="last">前回 ${fmt(last.w)}×${last.r}</span>`:""}`;
      row.onclick=()=>{addExercise(e.id);closeSheet();toast(e.name+" を追加");};
      body.appendChild(row);
    });
  });
  if(q && !DB.exercises.some(e=>e.name===q)){
    const add=document.createElement("button");add.className="pick new";add.textContent="＋「"+q+"」を新しい種目として追加";
    add.onclick=()=>{const id=uid();DB.exercises.push({id,name:q,grp:"その他"});save();addExercise(id);closeSheet();toast(q+" を追加");};
    body.insertBefore(add,body.firstChild);
  }
  if(!body.children.length)body.innerHTML='<div class="empty">該当なし。入力して新規追加できます。</div>';
}

/* ---------- tab switch ---------- */
function switchTab(t){
  curTab=t;
  $$(".tab-view").forEach(v=>v.classList.toggle("active",v.id==="tab-"+t));
  $$("#tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  if(t==="history")renderHistory();
  if(t==="stats")renderStats();
}

/* ---------- full render of log tab ---------- */
function renderLog(){renderHeader();renderStrength();renderCardio();renderBody();renderMemo();}

/* ---------- events ---------- */
$("#prevDay").onclick=()=>{curDate.setDate(curDate.getDate()-1);renderLog();};
$("#nextDay").onclick=()=>{curDate.setDate(curDate.getDate()+1);renderLog();};
$("#datePill").onclick=()=>{curDate=new Date();renderLog();toast("今日へ移動");};

$("#tabbar").onclick=e=>{const b=e.target.closest("button");if(b)switchTab(b.dataset.tab);};
$("#statSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;statMode=b.dataset.s;$$("#statSeg button").forEach(x=>x.classList.toggle("on",x===b));renderStats();};

$("#scrim").onclick=closeSheet;$("#exClose").onclick=closeSheet;
$("#exSearch").oninput=e=>renderPick(e.target.value);

// strength interactions (delegated)
$("#strList").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.rm!=null){if(confirm("この種目を削除しますか？")){day().strength.splice(+t.dataset.rm,1);save();renderStrength();}return;}
  if(t.dataset.del!=null){const[ei,si]=t.dataset.del.split(":").map(Number);day().strength[ei].sets.splice(si,1);save();renderStrength();return;}
  if(t.dataset.w!=null){const[ei,op]=t.dataset.w.split(":");const inp=$("#w-"+ei);let v=(+inp.value||0)+(op==="+"?stepW:-stepW);v=Math.max(0,Math.round(v*4)/4);inp.value=fmt(v);day().strength[ei].draftW=v;save();return;}
  if(t.dataset.r!=null){const[ei,op]=t.dataset.r.split(":");const inp=$("#r-"+ei);let v=(+inp.value||0)+(op==="+"?stepR:-stepR);v=Math.max(0,Math.round(v));inp.value=v;day().strength[ei].draftR=v;save();return;}
  if(t.dataset.add!=null){addSet(+t.dataset.add);return;}
});
$("#strList").addEventListener("change",e=>{
  const t=e.target;if(t.id&&t.id.startsWith("w-")){const ei=+t.id.slice(2);day().strength[ei].draftW=+t.value||0;save();}
  if(t.id&&t.id.startsWith("r-")){const ei=+t.id.slice(2);day().strength[ei].draftR=+t.value||0;save();}
});

function addSet(ei){
  const e=day().strength[ei];
  const w=+($("#w-"+ei).value)||0, r=+($("#r-"+ei).value)||0;
  if(r<=0){toast("回数を入力してください");return;}
  const prevBest=bestBefore(e.exId,key(curDate)); // best across all OTHER days
  // also consider today's earlier sets of this exercise
  let todayBest=0;e.sets.forEach(s=>todayBest=Math.max(todayBest,e1rm(s.w,s.r)));
  const benchmark=Math.max(prevBest,todayBest);
  const isPr=benchmark>0 && e1rm(w,r)>benchmark+0.01;
  e.sets.push({w,r,pr:isPr});
  e.draftW=w;e.draftR=r;
  save();renderStrength();
  if(isPr)toast("★ 自己ベスト更新！ "+fmt(w)+"kg×"+r,true);
}

// cardio delete + field input
$("#cardioList").addEventListener("click",e=>{if(e.target.dataset.cdel!=null){day().cardio.splice(+e.target.dataset.cdel,1);save();renderCardio();}});
$("#cardioList").addEventListener("input",e=>{const t=e.target;if(t.dataset.cf){const[i,f]=t.dataset.cf.split(":");const isText=(f==="course"||f==="memo");day().cardio[+i][f]=isText?t.value:(t.value===""?"":+t.value);save();}});

// body inputs
$("#bw").addEventListener("input",e=>{day().body.weight=e.target.value===""?null:+e.target.value;save();});
$("#bf").addEventListener("input",e=>{day().body.fat=e.target.value===""?null:+e.target.value;save();});
// memo
let memoT;$("#memo").addEventListener("input",e=>{day().memo.text=e.target.value;clearTimeout(memoT);memoT=setTimeout(save,400);});

/* ---------- init ---------- */
DB=load();migrate();save();
$("#btnExport").onclick=exportData;
$("#btnImport").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{const f=e.target.files[0];if(f)importData(f);e.target.value="";};
renderLog();
updateSaveStatus();
if(!storageOK)$("#warn").style.display="block";
</script>

}
